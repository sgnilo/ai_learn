title: AI Learn
description: AI learning roadmap, notes, projects, and practice logs.
lang: zh-CN
timezone: Asia/Shanghai
baseurl: "/ai_learn"

markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
